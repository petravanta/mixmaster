<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mixmaster</title>
<meta name="description" content="Cocktails ranked by what's in your bar, pushing the ones that use up opened, aging and specialty bottles.">
<meta name="theme-color" content="#fffcfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16131b" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem('petravanta.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://petravanta.github.io/general/shared/theme.css">
<style>
/* Mixmaster accent: chartreuse */
:root{--accent:#5d7a0f;--accent-ink:#ffffff;--accent-soft:#edf3db}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#b8d957;--accent-ink:#141b04;--accent-soft:#252f10}}
:root[data-theme="dark"]{--accent:#b8d957;--accent-ink:#141b04;--accent-soft:#252f10}

/* Line status: have, substitute, missing */
:root{--have:#2e7d32;--sub:#9a6700;--miss:#b3261e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--have:#6fd39a;--sub:#f2c14e;--miss:#ff8a80}}
:root[data-theme="dark"]{--have:#6fd39a;--sub:#f2c14e;--miss:#ff8a80}

/* Header: one brand row (hub link, name, theme switch, settings) and one row of tabs with the save state at the end,
   so it stays two rows on a phone instead of wrapping into three */
.topbar{flex-wrap:nowrap;gap:12px}
.brand{min-width:0;white-space:nowrap}
.top-end{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
nav.tabs{align-items:center}
nav.tabs .save-state{margin-left:auto;padding-left:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
@media (max-width:420px){.topbar{gap:8px}.brand{font-size:16px;gap:6px}.brand svg{width:22px;height:22px}nav.tabs button{padding-inline:9px}}
@media (max-width:359px){.brand .word{display:none}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.icon-btn{background:none;border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:18px;height:18px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
button.card:hover{border-color:var(--muted)}
.card .name{font-family:var(--f-display);font-weight:500;font-size:16px;letter-spacing:-.01em}
.card-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.how{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:1px}
.art{flex:none;display:block;overflow:visible}
.art .glass-fill{fill:currentColor;fill-opacity:.05}
.art .glass-line{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.art .liquid{opacity:.92}
.art .surface{stroke:#000;stroke-opacity:.18;stroke-width:1}
.art .ice{fill:#fff;fill-opacity:.35;stroke:#fff;stroke-opacity:.8;stroke-width:.8}
.art .bubbles{fill:#fff;fill-opacity:.75}
.art .cap{fill:var(--muted);fill-opacity:.7}
.art .tag{fill:var(--surface);fill-opacity:.4;stroke:var(--muted);stroke-width:.9}
.art.empty .glass-line{stroke-dasharray:2.5 2}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.hint{margin:0;font-size:14px;padding:8px 12px;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 8px 8px 0}
.card .why{margin:0;padding-left:16px;font-size:13px;color:var(--muted)}
.card .why li::marker{color:var(--accent)}
.dots{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted)}
.dot{display:inline-flex;align-items:center;gap:5px}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--have)}
.dot.close::before,.dot.loose::before{background:var(--sub)}
.dot.missing::before{background:var(--miss)}
.dot.staple::before,.dot.garnish::before{background:none;border:1.5px solid var(--faint);width:5px;height:5px}
.badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--sunk);color:var(--muted)}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.unlock{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.unlock:first-of-type{border-top:0}
.search{display:flex;gap:8px;align-items:center}
.search input{flex:1;border-radius:999px;padding:9px 16px}
.rows{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:4px 12px;padding:12px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.rrow:first-child{border-top:0}
.rrow:hover .name{color:var(--accent)}
.rrow .name{font-weight:600}
.rrow .dots{grid-column:2/-1}
.rrow .art{grid-row:span 2;align-self:start}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lines li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:baseline}
.lines .amt{font-family:var(--f-mono);font-size:13px;text-align:right;color:var(--muted)}
.lines .st{font-size:12px;color:var(--muted)}
.lines .st.have{color:var(--have)} .lines .st.close,.lines .st.loose{color:var(--sub)} .lines .st.missing{color:var(--miss)}
.drawer.still{animation:none}
.have-btn{border:1px dashed var(--line);background:none;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;color:var(--muted);margin-left:4px;white-space:nowrap}
.have-btn:hover{border-color:var(--accent);color:var(--accent)}
.have-btn[data-armed]{border-style:solid;border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.bottle{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.bottle:first-of-type{border-top:0}
.bottle .who{display:block;width:100%;border:0;padding:4px 0;background:none;text-align:left;font-weight:600;color:var(--ink)}
.bottle .who:hover{color:var(--accent)}
.bottle .meta{font-size:12px;color:var(--muted)}
.bottle .meta.hot{color:var(--sub);font-weight:600}
.level{width:54px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:inline-block;vertical-align:middle}
.level i{display:block;height:100%;background:var(--accent)}
.add{position:relative}
.add input{width:100%;border-radius:999px;padding:9px 16px}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);z-index:15;max-height:300px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.suggest button{display:flex;justify-content:space-between;gap:12px;width:100%;border:0;background:none;padding:9px 14px;text-align:left}
.suggest button:hover,.suggest button[aria-selected="true"]{background:var(--sunk)}
.suggest .muted{font-size:12px}
.seg{align-self:flex-start;display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.toast{display:flex;align-items:center;gap:12px}
.toast button{background:none;border:1px solid currentColor;color:inherit;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px}
.help{margin:0}
.help dt{font-weight:600;margin-top:8px}
.help dd{margin:0;color:var(--muted);font-size:14px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.check input{margin-top:4px}
a{color:var(--accent)}
#driveBanner{padding-top:16px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <a data-hub-link href="https://petravanta.github.io/general/">All apps</a>
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 6h24L18 17.5V25h5v2.5H9V25h5v-7.5z" fill="var(--accent)"/><circle cx="22.5" cy="9.5" r="2.6" fill="var(--bg)"/></svg>
        <span class="word">Mixmaster</span>
      </div>
      <span class="top-end"><span data-theme-switch></span><button class="icon-btn" type="button" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button></span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button type="button" data-tab="tonight">Tonight</button>
      <button type="button" data-tab="recipes">Recipes</button>
      <button type="button" data-tab="bar">My bar</button>
      <span class="save-state" id="saveState" role="status">Saved in this browser</span>
    </nav>
  </div>
</header>
<div class="wrap" id="driveBanner" hidden></div>
<main class="wrap" id="main"><p class="empty">Loading the catalog…</p></main>
<div data-version-footer></div>
<div id="layer"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script src="https://petravanta.github.io/general/shared/google-token.js"></script>
<script src="https://petravanta.github.io/general/shared/drive-store.js"></script>
<script src="https://petravanta.github.io/general/shared/local-day.js"></script>
<script src="mix.js"></script>
<script>
'use strict';
/* Mixmaster. The catalog (ingredients, glasses, recipes) is built-in knowledge in data/, loaded at startup.
   What people save (their bottles, what they made, favourites, settings) is one document that follows the
   "User data" section of petravanta/general STANDARDS.md, in localStorage and optionally their own Google Drive.
   mix.js does the ranking; this file only shows it. */

/* Google Drive sync: the shared OAuth client for petravanta.github.io (see README). Leave empty to turn Drive off. */
const GOOGLE_CLIENT_ID = '326863468616-4hf2conk0ks0s4qdva9tphphdo7ht7eh.apps.googleusercontent.com';
const KEY = 'mixmaster.data', TAB_KEY = 'mixmaster.tab';
const LISTS = ['bottles', 'made', 'favourites'];
const REPO = 'https://github.com/petravanta/mixmaster';
const LEVELS = [[1, 'Full'], [0.75, '¾ left'], [0.5, 'Half left'], [0.25, '¼ left'], [0.1, 'Almost empty']];
const MOODS = [['use-up', 'Use it up'], ['', 'Normal'], ['savour', 'Save it']];
const CAT_NAMES = { spirit: 'Spirits', liqueur: 'Liqueurs', 'fortified-wine': 'Vermouth, sherry and aperitif wines', wine: 'Wine', bitters: 'Bitters', syrup: 'Syrups', juice: 'Juices', fresh: 'Fresh', mixer: 'Mixers', pantry: 'Pantry' };

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const now = () => new Date().toISOString();
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const today = () => LocalDay.today(); // the person's own calendar day, not UTC's
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

/* ---------- Catalog ---------- */
let C = null; // Mix.catalog(...) plus glasses
async function loadCatalog() {
  const get = async f => { const r = await fetch('data/' + f); if (!r.ok) throw new Error(f); return r.json(); };
  const [ingredients, glasses, ids] = await Promise.all([get('ingredients.json'), get('glasses.json'), get('recipes.json')]);
  const recipes = (await Promise.all(ids.map(id => get(`recipes/${id}.json`).catch(() => null)))).filter(Boolean);
  C = Mix.catalog(ingredients, recipes);
  C.glasses = new Map(glasses.map(g => [g.id, g.name]));
  C.list = ingredients;
}
const ingName = id => (C.ing.get(id) || {}).name || id;

/* ---------- User data ---------- */
function blankDoc() { return { version: 1, settings: { updatedAt: '', units: 'ml', assumeStaples: true }, bottles: [], made: [], favourites: [], deleted: [] }; }
function cleanBottle(b) {
  if (!b || typeof b !== 'object' || typeof b.id !== 'string' || typeof b.ingredient !== 'string') return null;
  const o = { id: b.id, u: b.u || '', ingredient: b.ingredient };
  if (typeof b.label === 'string' && b.label.trim()) o.label = b.label.trim().slice(0, 80);
  if (typeof b.openedAt === 'string' && /^\d{4}-\d{2}-\d{2}/.test(b.openedAt)) o.openedAt = b.openedAt.slice(0, 10);
  if (Number.isFinite(b.level)) o.level = Math.min(1, Math.max(0, b.level));
  if (b.mood === 'use-up' || b.mood === 'savour') o.mood = b.mood;
  return o;
}
function upgrade(d) {
  const out = blankDoc();
  if (!d || typeof d !== 'object') return out;
  if (d.settings && typeof d.settings === 'object') out.settings = { ...out.settings, ...d.settings };
  out.deleted = Array.isArray(d.deleted) ? d.deleted.filter(x => typeof x === 'string') : [];
  out.bottles = (Array.isArray(d.bottles) ? d.bottles : []).map(cleanBottle).filter(Boolean);
  out.made = (Array.isArray(d.made) ? d.made : []).filter(m => m && typeof m.id === 'string' && typeof m.recipe === 'string' && typeof m.at === 'string').map(m => ({ id: m.id, u: m.u || '', recipe: m.recipe, at: m.at }));
  out.favourites = (Array.isArray(d.favourites) ? d.favourites : []).filter(f => f && typeof f.id === 'string' && typeof f.recipe === 'string').map(f => ({ id: f.id, u: f.u || '', recipe: f.recipe, on: !!f.on }));
  return out;
}
// Records combine by id, the newer `u` wins; anything either side deleted stays deleted; newer settings win
function mergeDocs(a, b) {
  a = upgrade(a); b = upgrade(b);
  const del = new Set([...a.deleted, ...b.deleted]);
  const out = { version: 1, settings: (a.settings.updatedAt || '') >= (b.settings.updatedAt || '') ? a.settings : b.settings, deleted: [...del] };
  for (const L of LISTS) {
    const m = new Map();
    for (const r of [...a[L], ...b[L]]) { const o = m.get(r.id); if (!o || (r.u || '') > (o.u || '')) m.set(r.id, r); }
    out[L] = [...m.values()].filter(r => !del.has(r.id));
  }
  return out;
}
let doc = upgrade(lsGet(KEY));
function save() { lsSet(KEY, doc); if (store.known) store.save(doc); showSaveState(); }
function touch(rec) { rec.u = now(); return rec; }
function setSetting(k, v) { doc.settings = { ...doc.settings, [k]: v, updatedAt: now() }; save(); }
function removeRecord(list, id) { doc[list] = doc[list].filter(r => r.id !== id); if (!doc.deleted.includes(id)) doc.deleted.push(id); save(); }

const favs = () => new Set(doc.favourites.filter(f => f.on).map(f => f.recipe));
function lastMade() { const m = new Map(); for (const x of doc.made) { const t = Date.parse(x.at); if (!m.has(x.recipe) || t > m.get(x.recipe)) m.set(x.recipe, t); } return m; }
function ranked(query) {
  return Mix.rank(C, doc.bottles, { assumeStaples: doc.settings.assumeStaples !== false, lastMade: lastMade(), favourites: favs(), query });
}

/* ---------- Units ---------- */
function amount(l) {
  const n = l.amount;
  switch (l.unit) {
    case 'ml': return doc.settings.units === 'oz' ? oz(n) : `${+n.toFixed(1)} ml`;
    case 'dash': return n === 1 ? '1 dash' : `${n} dashes`;
    case 'drop': return n === 1 ? '1 drop' : `${n} drops`;
    case 'barspoon': return n === 1 ? '1 bsp' : `${n} bsp`;
    case 'rinse': return 'rinse';
    case 'top': return 'top';
    case 'pinch': return 'pinch';
    case 'sprig': return n === 1 ? '1 sprig' : `${n} sprigs`;
    default: return n === 1 ? '' : String(n);
  }
}
// Nearest quarter ounce, written as bartenders do (¾ oz, 1½ oz)
function oz(ml) {
  const q = Math.round(ml / 30 * 4) / 4, w = Math.floor(q), f = { 0: '', 0.25: '¼', 0.5: '½', 0.75: '¾' }[q - w];
  return q === 0 ? '<¼ oz' : `${w || ''}${f} oz`;
}

/* ---------- Rendering ---------- */
let tab = ['tonight', 'recipes', 'bar'].includes(lsGet(TAB_KEY)) ? lsGet(TAB_KEY) : 'tonight';
let query = '', filter = 'all';
function setTab(t) {
  tab = t; lsSet(TAB_KEY, t);
  document.querySelectorAll('#tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t)));
  render();
}
function render() {
  if (!C) return;
  const m = $('#main');
  if (tab === 'tonight') m.innerHTML = tonight();
  else if (tab === 'recipes') { m.innerHTML = recipesView(); wireRecipes(); }
  else { m.innerHTML = barView(); wireBar(); }
}
/* ---------- Drink pictures ----------
   A small drawing of each drink: its glass (from the recipe's glass), its colour (color, or two for a gradient), a layer
   on top (float: foam, cream, crema), its ice and, for sparkling drinks, bubbles. Pure drawing; nothing here ranks. */
const GLASS = {
  // bowl: the part that holds the drink; top: where the drink's surface sits; base: the inside bottom; rest: stem and foot
  coupe: { bowl: 'M7 14Q7 31 24 31Q41 31 41 14Z', top: 17, base: 31, rest: 'M24 31V48M15 49H33' },
  'nick-and-nora': { bowl: 'M12 9Q11 31 24 32Q37 31 36 9Z', top: 13, base: 32, rest: 'M24 32V48M16 49H32' },
  rocks: { bowl: 'M8 20L10.5 50H37.5L40 20Z', top: 25, base: 47, rest: 'M11 47H37' },
  highball: { bowl: 'M13 4L14 50H34L35 4Z', top: 9, base: 47, rest: 'M14 47H34' },
  flute: { bowl: 'M18 4Q16.5 30 24 35Q31.5 30 30 4Z', top: 9, base: 35, rest: 'M24 35V48M17 49H31' },
  wine: { bowl: 'M15 6Q8 20 13 29Q18 35 24 35Q30 35 35 29Q40 20 33 6Z', top: 15, base: 35, rest: 'M24 35V48M15 49H33' },
  shot: { bowl: 'M15 28L16.5 50H31.5L33 28Z', top: 32, base: 47, rest: 'M16.5 47H31.5' }
};
let artN = 0;
function drinkArt(r, size = 40) {
  const g = GLASS[r.glass] || GLASS.rocks, n = 'da' + (++artN);
  const [c1, c2] = Array.isArray(r.color) ? r.color : [r.color || '#d9a560', null];
  const h = g.base - g.top, fill = c2 ? `url(#${n}g)` : c1;
  const ice = { cubes: [[15, g.top + 2, 9, -8], [24, g.top + h * 0.35, 9, 10], [16, g.top + h * 0.6, 8, 4]],
    large: [[17, g.top + 1, 14, 3]],
    crushed: Array.from({ length: 9 }, (_, k) => [12 + (k % 3) * 8 + (k * 7 % 3), g.top + 1 + Math.floor(k / 3) * (h / 3.4), 5, k * 23])
  }[r.ice] || [];
  const bubbles = r.tags.includes('sparkling') ? [[20, 0.8], [28, 0.55], [24, 0.3], [18, 0.4], [30, 0.85]].map(([x, f]) => `<circle cx="${x}" cy="${g.top + h * f}" r="1"/>`).join('') : '';
  return `<svg class="art" viewBox="0 0 48 52" width="${size}" height="${Math.round(size * 52 / 48)}" aria-hidden="true" focusable="false">
    <defs><clipPath id="${n}c"><path d="${g.bowl}"/></clipPath>${c2 ? `<linearGradient id="${n}g" x1="0" y1="1" x2="0" y2="0"><stop offset=".1" stop-color="${c1}"/><stop offset=".85" stop-color="${c2}"/></linearGradient>` : ''}</defs>
    <path d="${g.bowl}" class="glass-fill"/>
    <g clip-path="url(#${n}c)">
      <rect x="0" y="${g.top}" width="48" height="${h + 4}" fill="${fill}" class="liquid"/>
      ${r.float ? `<rect x="0" y="${g.top}" width="48" height="${Math.max(3, h * 0.16)}" fill="${r.float}"/>` : ''}
      ${ice.map(([x, y, s, a]) => `<rect class="ice" x="${x}" y="${y}" width="${s}" height="${s}" rx="1.5" transform="rotate(${a} ${x + s / 2} ${y + s / 2})"/>`).join('')}
      <g class="bubbles">${bubbles}</g>
      <line x1="0" x2="48" y1="${g.top}" y2="${g.top}" class="surface"/>
    </g>
    <path d="${g.bowl}${g.rest ? ' ' + g.rest : ''}" class="glass-line"/>
  </svg>`;
}
/* ---------- Bottle pictures ----------
   Each bottle in My bar is drawn in the same style as the drinks: an outline filled with what's inside (the
   ingredient's `color`), up to how much is left. The shape comes from the ingredient's `bottle`, or its category. */
const BOTTLE = {
  // body: the part that holds the liquid (neck included); top: the surface when full; cap: drawn solid; tag: a paper label
  tall: { body: 'M21 6H27V12Q27 14 30 15Q33 16 33 19V48Q33 50 31 50H17Q15 50 15 48V19Q15 16 18 15Q21 14 21 12Z', top: 19, cap: 'M20.5 2.5H27.5V6.5H20.5Z' },
  round: { body: 'M21.5 6H26.5V13Q26.5 16 30.5 18.5Q34 21 34 25V48Q34 50 32 50H16Q14 50 14 48V25Q14 21 17.5 18.5Q21.5 16 21.5 13Z', top: 24, cap: 'M21 2.5H27V6.5H21Z' },
  squat: { body: 'M21 10H27V15Q27 17 31 18Q37 19 37 23V48Q37 50 35 50H13Q11 50 11 48V23Q11 19 17 18Q21 17 21 15Z', top: 23, cap: 'M20 5.5H28V10.5H20Z' },
  wine: { body: 'M21.5 9H26.5V14Q26.5 19 30 22Q32 24 32 28V48Q32 50 30 50H18Q16 50 16 48V28Q16 24 18 22Q21.5 19 21.5 14Z', top: 28, cap: 'M21.2 2.5H26.8V10H21.2Z' },
  dasher: { body: 'M22 14H26V18Q26 20 29 21.5Q31 23 31 26V48Q31 50 29 50H19Q17 50 17 48V26Q17 23 19 21.5Q22 20 22 18Z', top: 26, cap: 'M21.5 9H26.5V14.5H21.5Z', tag: 'M15.5 29H32.5V44H15.5Z' },
  flask: { body: 'M20 12H28V16Q35 18 35 26V48Q35 50 33 50H15Q13 50 13 48V26Q13 18 20 16Z', top: 26, cap: 'M19.5 8H28.5V12H19.5Z', rest: 'M19.5 10Q16 13 19 17M28.5 10Q32 13 29 17' },
  jug: { body: 'M15 8H31L30 14Q35 22 35 34V48Q35 50 33 50H15Q13 50 13 48V34Q13 22 18 14Z', top: 20, rest: 'M33.5 19Q40 21 39.5 30Q39 36 35 38.5M15 8L12.5 6' },
  jar: { body: 'M14 15H34V48Q34 50 32 50H16Q14 50 14 48Z', top: 18, cap: 'M13 10H35V15H13Z' },
  soda: { body: 'M22 6H26V10Q26 13 28 16Q30 19 30 23V48Q30 50 28 50H20Q18 50 18 48V23Q18 19 20 16Q22 13 22 10Z', top: 23, cap: 'M21.5 3H26.5V6.5H21.5Z' }
};
const BOTTLE_FOR = { spirit: 'tall', liqueur: 'round', 'fortified-wine': 'wine', wine: 'wine', bitters: 'dasher', syrup: 'flask', juice: 'jug', fresh: 'jar', pantry: 'jar', mixer: 'soda' };
function bottleArt(b, size = 40) {
  const i = C.ing.get(b.ingredient) || {}, g = BOTTLE[i.bottle] || BOTTLE[BOTTLE_FOR[i.category]] || BOTTLE.round, n = 'ba' + (++artN);
  const level = b.level == null ? 1 : Math.min(1, Math.max(0, b.level)), base = 50, y = base - (base - g.top) * level;
  const fizzy = i.category === 'mixer' && i.id !== 'cola' || i.family === 'sparkling';
  const bubbles = fizzy && level > 0.2 ? [[20, 0.75], [27, 0.45], [23, 0.2], [25, 0.85]].map(([x, f]) => `<circle cx="${x}" cy="${y + (base - y) * f}" r="1"/>`).join('') : '';
  return `<svg class="art${level ? '' : ' empty'}" viewBox="0 0 48 52" width="${size}" height="${Math.round(size * 52 / 48)}" aria-hidden="true" focusable="false">
    <defs><clipPath id="${n}c"><path d="${g.body}"/></clipPath></defs>
    <path d="${g.body}" class="glass-fill"/>
    <g clip-path="url(#${n}c)">
      ${level ? `<rect x="0" y="${y}" width="48" height="${base - y + 2}" fill="${i.color || '#d9a560'}" class="liquid"/>` : ''}
      <g class="bubbles">${bubbles}</g>
      ${level && level < 1 ? `<line x1="0" x2="48" y1="${y}" y2="${y}" class="surface"/>` : ''}
    </g>
    ${g.tag ? `<path d="${g.tag}" class="tag"/>` : ''}
    ${g.cap ? `<path d="${g.cap}" class="cap"/>` : ''}
    <path d="${g.body}${g.rest ? ' ' + g.rest : ''}" class="glass-line"/>
  </svg>`;
}
const ICE = { cubes: 'on ice', large: 'on a large cube', crushed: 'on crushed ice' };
const methodLine = r => { const m = Mix.methodHint(C, r); return `<span title="${esc(m.why)}">${esc(m.label)}</span> · ${esc(C.glasses.get(r.glass) || r.glass)}`; };
function dots(a) {
  return `<div class="dots">${a.lines.map(l => `<span class="dot ${l.status}" title="${esc(statusText(l))}">${esc(ingName(l.line.ingredient))}</span>`).join('')}</div>`;
}
function statusText(l) {
  switch (l.status) {
    case 'have': return 'In your bar' + (l.bottle && l.bottle.label ? `: ${l.bottle.label}` : '');
    case 'close': return `Use your ${l.bottle.label || ingName(l.bottle.ingredient)}`;
    case 'loose': return `At a stretch, your ${l.bottle.label || ingName(l.bottle.ingredient)}`;
    case 'staple': return 'Grab some';
    case 'garnish': return 'Garnish, if you have it';
    default: return l.line.optional ? 'Optional' : 'Missing';
  }
}
function card(a) {
  const why = Mix.reasons(C, a);
  return `<button class="card" type="button" data-recipe="${a.recipe.id}">
    <div class="card-head">${drinkArt(a.recipe, 36)}<span class="name">${esc(a.recipe.name)}<span class="how">${methodLine(a.recipe)}</span></span>${a.makeable ? `<span class="badge ok">${a.stretch ? 'At a stretch' : 'Can make'}</span>` : `<span class="badge">${a.missing.length} missing</span>`}</div>
    ${why.length ? `<ul class="why">${why.slice(0, 3).map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    ${dots(a)}</button>`;
}
function tonight() {
  if (!doc.bottles.length) return `<div class="stack">
    <div class="banner"><p><b>Tell Mixmaster what’s in your bar</b> and it finds the drinks you can make tonight, starting with the ones that finish off that aging vermouth or the crème de violette you bought for one recipe.</p><button class="btn primary" type="button" onclick="setTab('bar')">Add bottles</button></div>
    <section class="stack"><h3>Some classics to start with</h3><div class="cards">${ranked().filter(a => ['negroni', 'daiquiri', 'last-word', 'old-pal'].includes(a.recipe.id)).map(card).join('')}</div></section></div>`;
  const all = ranked();
  const can = all.filter(a => a.makeable).slice(0, 9);
  const near = all.filter(a => !a.makeable && a.missing.length === 1).slice(0, 6);
  const unl = Mix.unlocks(C, all);
  const hot = doc.bottles.map(b => ({ b, u: Mix.urgency(C, b, Date.now()) })).filter(x => x.u.value > 1 && !(x.b.level <= 0)).sort((x, y) => y.u.value - x.u.value);
  return `<div class="stack">
    ${hot.length ? `<div class="banner"><p><b>Use soon:</b> ${hot.slice(0, 4).map(x => esc(x.b.label || ingName(x.b.ingredient))).join(', ')}. The drinks below lean on them.</p></div>` : ''}
    <section class="stack"><div class="section-head"><h2>You can make</h2><span class="small muted">${all.filter(a => a.makeable).length} drinks with what you have</span></div>
      ${can.length ? `<div class="cards">${can.map(card).join('')}</div>` : '<p class="empty">Nothing yet. Add a few more bottles, or see what one more bottle would unlock below.</p>'}</section>
    ${unl.length ? `<section class="stack"><h2>One bottle away</h2><div class="panel">${unl.map(u => `<div class="unlock"><div><b>${esc(ingName(u.ingredient))}</b><div class="small muted">${u.recipes.slice(0, 4).map(id => esc(C.byId.get(id).name)).join(', ')}${u.recipes.length > 4 ? ` and ${u.recipes.length - 4} more` : ''}</div></div><span class="badge">+${u.recipes.length}</span></div>`).join('')}</div></section>` : ''}
    ${near.length ? `<section class="stack"><h2>Nearly there</h2><div class="cards">${near.map(card).join('')}</div></section>` : ''}
  </div>`;
}
function recipesView() {
  const tags = [...new Set(C.recipes.flatMap(r => r.tags))].sort();
  return `<div class="stack">
    <div class="search"><label class="sr-only" for="q">Search recipes</label><input type="search" id="q" placeholder="Search drinks, bottles or styles: chartreuse, sour, tiki…" value="${esc(query)}" autocomplete="off"></div>
    <div class="chips" id="filters">${[['all', 'All'], ['can', 'Can make'], ['near', 'One away'], ['fav', 'Favourites']].map(([k, n]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${filter === k}">${n}</button>`).join('')}
      ${tags.map(t => `<button class="chip" type="button" data-f="tag:${t}" aria-pressed="${filter === 'tag:' + t}">${esc(t.replace(/-/g, ' '))}</button>`).join('')}</div>
    <div class="panel"><div class="rows" id="rows">${recipeRows()}</div></div>
    <p class="small muted">Know one that should be here? <a href="${REPO}/issues/new?template=recipe.yml" target="_blank" rel="noopener">Suggest a recipe</a> or add it with a pull request (<a href="${REPO}/blob/main/CONTRIBUTING.md" target="_blank" rel="noopener">how</a>).</p>
  </div>`;
}
function recipeRows() {
  const f = favs();
  const list = ranked(query).filter(a => filter === 'all' || (filter === 'can' && a.makeable) || (filter === 'near' && !a.makeable && a.missing.length === 1) || (filter === 'fav' && f.has(a.recipe.id)) || (filter.startsWith('tag:') && a.recipe.tags.includes(filter.slice(4))));
  if (!list.length) return `<p class="empty">No drinks match${query ? ` “${esc(query)}”` : ''}.</p>`;
  return list.map(a => `<button class="rrow" type="button" data-recipe="${a.recipe.id}">${drinkArt(a.recipe, 36)}<span class="name">${f.has(a.recipe.id) ? '★ ' : ''}${esc(a.recipe.name)}<span class="how">${methodLine(a.recipe)}</span></span><span>${a.makeable ? `<span class="badge ok">${a.stretch ? 'Stretch' : 'Can make'}</span>` : a.missing.length === 1 ? '<span class="badge">1 away</span>' : ''}</span>${dots(a)}</button>`).join('');
}
function wireRecipes() {
  const q = $('#q');
  q.oninput = () => { query = q.value; $('#rows').innerHTML = recipeRows(); };
  $('#filters').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = filter === b.dataset.f ? 'all' : b.dataset.f; document.querySelectorAll('#filters [data-f]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.f === filter))); $('#rows').innerHTML = recipeRows(); };
}

/* ---------- Recipe drawer ---------- */
function recipeDrawer(id, still) {
  const a = ranked().find(x => x.recipe.id === id); if (!a) return;
  const r = a.recipe, fav = favs().has(id), last = lastMade().get(id);
  const hint = Mix.methodHint(C, r);
  openDrawer(r.name, `
    <div class="hero">${drinkArt(r, 64)}<div class="stack" style="gap:6px"><div class="row">${a.makeable ? `<span class="badge ok">${a.stretch ? 'At a stretch' : 'You can make this'}</span>` : `<span class="badge">Missing ${a.missing.map(x => esc(ingName(x))).join(', ')}</span>`}</div><span class="small muted">${esc(hint.label)} · ${esc(C.glasses.get(r.glass) || r.glass)}${r.ice ? ' · ' + ICE[r.ice] : ''}${r.origin ? ' · ' + esc(r.origin) : ''}</span></div></div>
    ${Mix.reasons(C, a).length ? `<ul class="why small muted" style="margin:0;padding-left:18px">${Mix.reasons(C, a).map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
    <section class="stack"><h3>Ingredients</h3><ul class="lines">${a.lines.map(l => `<li><span class="amt">${esc(amount(l.line))}</span><span>${esc(ingName(l.line.ingredient))}${l.line.optional ? ' <span class="muted small">(optional)</span>' : ''}${l.line.garnish ? ' <span class="muted small">(garnish)</span>' : ''}${l.line.note ? ` <span class="muted small">${esc(l.line.note)}</span>` : ''} <span class="st ${l.status}">· ${esc(statusText(l))}</span>${l.status !== 'have' && !a.lines.some(x => x !== l && x.line.ingredient === l.line.ingredient && x.status === 'have') ? ` <button class="have-btn" type="button" data-have="${esc(l.line.ingredient)}" aria-label="I have ${esc(ingName(l.line.ingredient))}: add it to my bar">+ I have it</button>` : ''}</span></li>`).join('')}</ul>
      <p class="small muted">Own a bottle that isn’t in your bar yet? Tap <b>+ I have it</b>, then tap again to confirm.</p></section>
    <section class="stack"><h3>Method</h3><p class="hint"><b>${esc(hint.label)}.</b> ${esc(hint.why)}</p><ol class="steps">${r.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol>${r.why ? `<p class="small muted">${esc(r.why)}</p>` : ''}</section>
    <div class="row"><button class="btn primary" type="button" id="madeBtn">I made this</button><button class="btn" type="button" id="favBtn">${fav ? '★ Favourite' : '☆ Favourite'}</button></div>
    <p class="small muted">${last ? `Last made ${new Date(last).toLocaleDateString()}. ` : ''}${r.contributor ? `Added by ${esc(r.contributor)}. ` : ''}<a href="${REPO}/blob/main/data/recipes/${r.id}.json" target="_blank" rel="noopener">See or improve this recipe on GitHub</a></p>`, d => {
    // Adding a bottle takes two deliberate taps on the same button, at least 400 ms apart (so a double-tap or a brushed
    // finger doesn't count), and the toast offers Undo. The armed state lapses after 4 seconds.
    d.querySelector('.lines').onclick = e => {
      const btn = e.target.closest('[data-have]'); if (!btn) return;
      const t = Date.now(), armed = +btn.dataset.armed || 0;
      if (!armed || t - armed > 4000) {
        d.querySelectorAll('[data-have][data-armed]').forEach(x => { delete x.dataset.armed; x.textContent = '+ I have it'; });
        btn.dataset.armed = t; btn.textContent = 'Tap again to add';
        setTimeout(() => { if (btn.dataset.armed == t) { delete btn.dataset.armed; btn.textContent = '+ I have it'; } }, 4000);
        return;
      }
      if (t - armed < 400) return;
      const ing = btn.dataset.have, b = touch({ id: uid(), ingredient: ing, level: 1 });
      doc.bottles.push(b); save(); render(); recipeDrawer(id, true);
      toast(`${ingName(ing)} added to your bar`, 5000, { label: 'Undo', run: () => { removeRecord('bottles', b.id); render(); if ($('#layer').innerHTML) recipeDrawer(id, true); } });
    };
    d.querySelector('#madeBtn').onclick = () => {
      doc.made.push(touch({ id: uid(), recipe: id, at: now() })); save(); closeDrawer(); render();
      const used = a.lines.filter(l => l.bottle && l.line.unit === 'ml' && l.line.amount >= 15).map(l => l.bottle);
      toast(`Cheers 🥂 ${r.name} logged`, 4000, used.length ? { label: 'Update levels', run: () => openBottle(used[0].id) } : null);
    };
    d.querySelector('#favBtn').onclick = () => {
      const fid = 'fav-' + id, f = doc.favourites.find(x => x.id === fid);
      if (f) { f.on = !f.on; touch(f); } else doc.favourites.push(touch({ id: fid, recipe: id, on: true }));
      save(); recipeDrawer(id, true); render();
    };
  }, still);
}

/* ---------- My bar ---------- */
function bottleMeta(b) {
  const u = Mix.urgency(C, b, Date.now());
  if (u.value > 1) return { text: u.why.join(', '), hot: true };
  const bits = [];
  if (b.openedAt) bits.push(`opened ${LocalDay.toDate(b.openedAt).toLocaleDateString()}`);
  if (b.mood === 'savour') bits.push('saving it');
  return { text: bits.join(' · '), hot: false };
}
function barView() {
  const groups = new Map();
  [...doc.bottles].sort((x, y) => ingName(x.ingredient).localeCompare(ingName(y.ingredient))).forEach(b => {
    const c = (C.ing.get(b.ingredient) || {}).category || 'pantry';
    if (!groups.has(c)) groups.set(c, []); groups.get(c).push(b);
  });
  const order = Object.keys(CAT_NAMES).filter(c => groups.has(c));
  return `<div class="stack">
    <div class="add"><label class="sr-only" for="addIn">Add a bottle</label><input type="search" id="addIn" placeholder="Add a bottle: gin, Campari, falernum…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="suggest"><div class="suggest" id="suggest" role="listbox" hidden></div></div>
    ${doc.bottles.length ? '' : '<p class="empty">Your bar is empty. Add what you have, opened or not. Mark the bottles you want gone as <b>Use it up</b>, and the precious ones as <b>Save it</b>.</p>'}
    ${order.map(c => `<section class="stack"><h3>${esc(CAT_NAMES[c])}</h3><div class="panel">${groups.get(c).map(b => { const m = bottleMeta(b); return `<div class="bottle">${bottleArt(b, 36)}<button class="who" type="button" data-bottle="${b.id}">${esc(b.label || ingName(b.ingredient))}${b.label ? ` <span class="muted small">${esc(ingName(b.ingredient))}</span>` : ''}${m.text ? `<div class="meta${m.hot ? ' hot' : ''}">${esc(m.text)}</div>` : ''}</button><span class="level" title="${esc(levelName(b.level))}"><i style="width:${Math.round((b.level == null ? 1 : b.level) * 100)}%"></i></span></div>`; }).join('')}</div></section>`).join('')}
  </div>`;
}
const levelName = l => (LEVELS.find(x => x[0] === (l == null ? 1 : l)) || [0, Math.round((l || 0) * 100) + '% left'])[1];
function matches(q) {
  q = Mix.fold(q.trim()); if (!q) return [];
  return C.list.map(i => { const w = C.words.get(i.id), n = Mix.fold(i.name); const s = n.startsWith(q) ? 3 : n.includes(q) ? 2 : w.includes(q) ? 1 : 0; return { i, s }; })
    .filter(x => x.s).sort((a, b) => b.s - a.s || (C.uses.get(b.i.id) - C.uses.get(a.i.id))).slice(0, 8).map(x => x.i);
}
function wireBar() {
  const inp = $('#addIn'), sug = $('#suggest');
  let opts = [], sel = 0;
  const show = () => {
    opts = matches(inp.value); sel = 0;
    sug.hidden = !opts.length; inp.setAttribute('aria-expanded', String(!!opts.length));
    sug.innerHTML = opts.map((i, n) => `<button type="button" role="option" data-add="${i.id}" aria-selected="${n === sel}"><span>${esc(i.name)}</span><span class="muted">${C.uses.get(i.id)} recipe${C.uses.get(i.id) === 1 ? '' : 's'}</span></button>`).join('');
  };
  const add = id => {
    const b = touch({ id: uid(), ingredient: id, level: 1 });
    doc.bottles.push(b); save(); render(); $('#addIn').focus();
    toast(`${ingName(id)} added`, 4000, { label: 'Details', run: () => openBottle(b.id) });
  };
  inp.oninput = show;
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!opts.length) return; sel = (sel + (e.key === 'ArrowDown' ? 1 : opts.length - 1)) % opts.length; sug.querySelectorAll('[data-add]').forEach((b, n) => b.setAttribute('aria-selected', String(n === sel))); }
    if (e.key === 'Enter' && opts[sel]) { e.preventDefault(); add(opts[sel].id); }
    if (e.key === 'Escape') { inp.value = ''; show(); }
  };
  sug.onclick = e => { const b = e.target.closest('[data-add]'); if (b) add(b.dataset.add); };
}
function openBottle(id) {
  const b = doc.bottles.find(x => x.id === id); if (!b) return;
  const i = C.ing.get(b.ingredient) || {}, u = Mix.urgency(C, b, Date.now());
  const n = C.uses.get(b.ingredient) || 0;
  openDrawer(b.label || i.name || b.ingredient, `
    <div class="hero">${bottleArt(b, 56)}<p class="small muted" style="margin:0">${esc(i.name)}${i.shelfLifeDays ? ` · keeps about ${i.shelfLifeDays} days once opened` : ''} · used in ${n} recipe${n === 1 ? '' : 's'} here<br>${esc(levelName(b.level))}</p></div>
    <label class="field">Brand or label<input type="text" id="bLabel" value="${esc(b.label || '')}" placeholder="e.g. Dolin, Luxardo"></label>
    <label class="field">Opened<input type="date" id="bOpened" value="${esc(b.openedAt || '')}" max="${today()}"></label>
    <div class="row"><button class="btn sm" type="button" id="bToday">Opened today</button>${b.openedAt ? '<button class="btn sm ghost" type="button" id="bSealed">Still sealed</button>' : ''}</div>
    <div class="stack" style="gap:6px"><h3>How much is left</h3><div class="seg" id="bLevel">${LEVELS.map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="${(b.level == null ? 1 : b.level) === v}">${t}</button>`).join('')}</div></div>
    <div class="stack" style="gap:6px"><h3>Priority</h3><div class="seg" id="bMood">${MOODS.map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="${(b.mood || '') === v}">${t}</button>`).join('')}</div>
      <p class="small muted"><b>Use it up</b> pushes drinks that pour it to the top. <b>Save it</b> keeps them down, for the bottle you’re rationing.</p></div>
    ${u.why.length ? `<p class="small">Right now: ${esc(u.why.join(', '))}.</p>` : ''}
    <div class="row"><button class="btn primary" type="button" id="bDone">Done</button><button class="btn" type="button" id="bFinished">Finished it</button><button class="btn ghost danger" type="button" id="bRemove">Remove</button></div>`, d => {
    const upd = (k, v) => { if (v === '' || v == null) delete b[k]; else b[k] = v; touch(b); save(); render(); };
    d.querySelector('#bLabel').onchange = e => upd('label', e.target.value.trim());
    d.querySelector('#bOpened').onchange = e => upd('openedAt', e.target.value);
    d.querySelector('#bToday').onclick = () => { upd('openedAt', today()); openBottle(id); };
    const sealed = d.querySelector('#bSealed'); if (sealed) sealed.onclick = () => { upd('openedAt', ''); openBottle(id); };
    d.querySelector('#bLevel').onclick = e => { const x = e.target.closest('[data-v]'); if (x) { upd('level', +x.dataset.v); openBottle(id); } };
    d.querySelector('#bMood').onclick = e => { const x = e.target.closest('[data-v]'); if (x) { upd('mood', x.dataset.v); openBottle(id); } };
    d.querySelector('#bDone').onclick = closeDrawer;
    d.querySelector('#bFinished').onclick = () => { removeRecord('bottles', id); closeDrawer(); render(); toast(`${b.label || i.name} finished 🖤`); };
    d.querySelector('#bRemove').onclick = () => {
      const copy = { ...b }; removeRecord('bottles', id); closeDrawer(); render();
      toast('Bottle removed', 5000, { label: 'Undo', run: () => { doc.deleted = doc.deleted.filter(x => x !== id); doc.bottles.push(touch(copy)); save(); render(); } });
    };
  });
}

/* ---------- Drawer, toast, download ---------- */
function openDrawer(title, inner, wire, still) {
  // still: redrawing an open drawer in place, so skip the slide-in
  $('#layer').innerHTML = `<div class="scrim" data-close></div><aside class="drawer${still ? ' still' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><button class="x" type="button" data-close aria-label="Close">×</button><h2>${esc(title)}</h2>${inner}</aside>`;
  $('#layer').querySelectorAll('[data-close]').forEach(b => b.onclick = closeDrawer);
  if (wire) wire($('#layer .drawer'));
  // One Back-stack layer per open drawer (redraws and drawer-to-drawer swaps reuse it), so the phone's Back,
  // the browser's Back and Esc close the drawer instead of leaving the app (STANDARDS.md, "Back button")
  if (!drawerLayer && window.BackStack) drawerLayer = BackStack.push(() => { drawerLayer = null; $('#layer').innerHTML = ''; }, { esc: true });
}
let drawerLayer = null;
function closeDrawer() { if (drawerLayer) drawerLayer.close(); else $('#layer').innerHTML = ''; }
let toastTimer;
function toast(msg, ms = 2600, action) {
  clearTimeout(toastTimer);
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg;
  if (action) { const b = document.createElement('button'); b.type = 'button'; b.textContent = action.label; b.onclick = () => { t.remove(); action.run(); }; t.appendChild(b); }
  toastTimer = setTimeout(() => t.remove(), ms);
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

const store = DriveStore({
  clientId: GOOGLE_CLIENT_ID, file: 'Mixmaster data.json', app: 'mixmaster', key: 'mixmaster.drive',
  empty: blankDoc, merge: (remote, local) => mergeDocs(local, remote),
  onChange: () => { showSaveState(); refreshDrivePanel(); },
  onRemote: data => remoteIn(data)
});
function remoteIn(data) { doc = mergeDocs(doc, data); lsSet(KEY, doc); if (!$('#layer').innerHTML) render(); }
// The status line's data-state is ok, saving, local or the Drive store's problem.kind (STANDARDS.md, "Nightbloom");
// problems only the person can fix (Drive full, permission refused) also get a banner over the page
function showSaveState() {
  const el = $('#saveState'), p = store.known ? store.problem : null, text = store.known ? store.status() : '';
  el.textContent = text || 'Saved in this browser';
  el.dataset.state = !store.known || !text ? 'local' : p ? p.kind : /^Saving/.test(text) ? 'saving' : store.live() ? 'ok' : 'local';
  const ban = $('#driveBanner'), stuck = p && (p.kind === 'full' || p.kind === 'denied');
  ban.hidden = !stuck;
  if (stuck) ban.innerHTML = `<div class="banner bad"><p>${esc(p.text)}. Your bar is safe in this browser${p.kind === 'full' ? ': free some space in Google Drive and it saves again by itself' : ': reconnect in Settings and allow Mixmaster to see its own files'}.</p><button class="btn sm" type="button" data-open-settings>Settings</button></div>`;
}

/* ---------- Settings ---------- */
function drivePanel() {
  if (!store.configured) return '<p class="small muted">Drive sync is turned off in this copy of the app.</p>';
  if (!store.known) return `<p class="small">Keep your bar in your own Google Drive, in <b>petravanta/Mixmaster/${esc(store.file)}</b>, and use it on your phone and computer. The app can only see files it created there.</p><div class="row"><button class="btn primary" type="button" data-drive="on">Connect Google Drive</button></div>`;
  return `<p class="small">${esc(store.status())}. Everything goes to <b>petravanta/Mixmaster/${esc(store.file)}</b> in your Drive a moment after each change.</p>
    <div class="row">${store.live() ? '' : '<button class="btn primary" type="button" data-drive="on">Reconnect</button>'}<button class="btn ghost" type="button" data-drive="off">Disconnect</button></div>`;
}
function wireDrive(el) {
  el.querySelectorAll('[data-drive]').forEach(b => b.onclick = async () => {
    if (b.dataset.drive === 'off') { store.signOut(); showSaveState(); refreshDrivePanel(); return toast('Disconnected. Your bar stays in this browser.'); }
    try { const remote = await store.load(true); doc = mergeDocs(doc, remote); save(); render(); toast('Connected to Google Drive'); }
    catch (e) { toast(e && e.code === 'offline' ? 'You seem to be offline.' : 'Couldn’t connect to Google Drive.'); }
  });
}
function refreshDrivePanel() { const dp = $('#drivePanel'); if (dp) { dp.innerHTML = drivePanel(); wireDrive(dp); } }
function settingsDrawer() {
  const s = doc.settings;
  openDrawer('Settings', `
    <section class="stack"><h3>Measures</h3><div class="seg" id="stUnits"><button type="button" data-v="ml" aria-pressed="${s.units !== 'oz'}">ml</button><button type="button" data-v="oz" aria-pressed="${s.units === 'oz'}">oz</button></div></section>
    <section class="stack"><h3>Staples</h3><label class="check"><input type="checkbox" id="stStaples" ${s.assumeStaples !== false ? 'checked' : ''}><span>Assume I have the basics: citrus, simple syrup, soda, egg, mint and peels. Drinks that need them still say what to grab.</span></label></section>
    <section class="stack"><h3>Google Drive</h3><div id="drivePanel">${drivePanel()}</div></section>
    <section class="stack"><h3>Backup and import</h3>
      <p class="small muted">A backup holds your bottles, favourites and what you made. Importing one merges it with what’s here.</p>
      <div class="row"><button class="btn" type="button" id="stExport">Export backup</button><button class="btn" type="button" id="stImport">Import…</button></div></section>
    <section class="stack"><h3>How recommendations work</h3>
      <dl class="help small">
        <dt>Coverage first</dt><dd>A drink ranks by how much of it your bar covers. A missing spirit counts heavily, a missing lime barely. A close substitute (rye for bourbon) nearly counts; a stand-in from the same family (Irish for bourbon) counts as a stretch.</dd>
        <dt>Then what needs using</dt><dd>Drinks get a boost for each bottle they pour that wants using: opened vermouth, sherry and wine near the end of their life, specialty bottles, ones only a few recipes use, nearly empty ones and anything you marked <b>Use it up</b>. The more of it a drink pours, the bigger the boost. Drinks that pour a bottle you’re saving drop down.</dd>
        <dt>And a little variety</dt><dd>Something you made in the last few days slips down a bit; favourites rise a little.</dd>
        <dt>One bottle away</dt><dd>The single bottles that would let you make the most new drinks, weighted by how much those drinks would use up.</dd>
      </dl></section>`, d => {
    wireDrive(d.querySelector('#drivePanel'));
    d.querySelector('#stUnits').onclick = e => { const b = e.target.closest('[data-v]'); if (!b) return; setSetting('units', b.dataset.v); d.querySelectorAll('#stUnits [data-v]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); };
    d.querySelector('#stStaples').onchange = e => { setSetting('assumeStaples', e.target.checked); render(); };
    d.querySelector('#stExport').onclick = () => download(new Blob([JSON.stringify(doc, null, 1)], { type: 'application/json' }), `Mixmaster backup ${today()}.json`);
    d.querySelector('#stImport').onclick = () => $('#fileIn').click();
  });
}
$('#fileIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  let data = null; try { data = JSON.parse(await f.text()); } catch (_) {}
  if (!data || !Array.isArray(data.bottles)) return toast('That file isn’t a Mixmaster backup.');
  doc = mergeDocs(doc, data); save(); closeDrawer(); render(); toast('Backup merged in');
};

/* ---------- Events ---------- */
$('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); };
$('#settingsBtn').onclick = settingsDrawer;
$('#driveBanner').onclick = e => { if (e.target.closest('[data-open-settings]')) settingsDrawer(); };
$('#main').addEventListener('click', e => {
  const r = e.target.closest('[data-recipe]'); if (r) return recipeDrawer(r.dataset.recipe);
  const b = e.target.closest('[data-bottle]'); if (b) return openBottle(b.dataset.bottle);
});
// Esc without the Back stack (it didn't load, say offline on a first visit); with it, the layer handles Esc
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !drawerLayer && $('#layer').innerHTML) closeDrawer(); });
addEventListener('storage', e => { if (e.key === KEY) { doc = upgrade(lsGet(KEY)); if (!$('#layer').innerHTML) render(); } });
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && store.known && store.live() && await store.refresh()) remoteIn(store.data);
});

/* ---------- Start ---------- */
(async () => {
  if (store.known && store.data) doc = mergeDocs(doc, store.data);
  showSaveState();
  try { await loadCatalog(); }
  catch (e) { $('#main').innerHTML = '<p class="empty">Couldn’t load the recipe catalog. Check your connection and reload.</p>'; return; }
  // ?do=add-bottle and ?do=tonight from the home-screen shortcuts
  const act = new URLSearchParams(location.search).get('do');
  if (act) { history.replaceState(null, '', location.pathname); if (act === 'add-bottle') tab = 'bar'; if (act === 'tonight') tab = 'tonight'; }
  setTab(tab);
  if (act === 'add-bottle') $('#addIn') && $('#addIn').focus();
  if (store.known && store.live()) {
    try { doc = mergeDocs(doc, await store.load(false)); lsSet(KEY, doc); store.save(doc); render(); } catch (e) { showSaveState(); }
  }
})();
</script>
<script src="https://petravanta.github.io/general/shared/app.js" defer></script>
</body>
</html>
